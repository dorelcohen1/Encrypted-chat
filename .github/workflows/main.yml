name: Compile & Quality Checks (POC)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck g++

      - name: fixed Static Analysis (Cppcheck)
        run: |
          cppcheck --enable=warning,performance,portability \
          -IPOC \
          -iPOC/include \
          --suppress=missingInclude \
          --suppress=toomanyconfigs \
          --inline-suppr \
          --error-exitcode=1 \
          POC/
          
      - name: Static Analysis (Cppcheck)
        run: |
          cppcheck --enable=all -iPOC/include --suppress=missingIncludeSystem --error-exitcode=1 POC/
              
      - name: Compile C++ files in POC folder
        run: |
          g++ -std=c++17 -isystem POC/include -pthread POC/*.cpp -o build_test

      - name: Build and Run with AddressSanitizer (Leaks & Memory Errors)
        run: |
          g++ -std=c++17 -isystem POC/include -fsanitize=address,leak -g -pthread POC/*.cpp -o sanitize_test
          ./sanitize_test

      - name: Build and Run with UndefinedBehaviorSanitizer
        run: |
          g++ -std=c++17 -isystem POC/include -fsanitize=undefined -g -pthread POC/*.cpp -o ubsan_test
          ./ubsan_test
